<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="apple-touch-icon" href="/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Fábrica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .accordion-button:focus { box-shadow: none; }
        .accordion-button:not(.collapsed) { background-color: #e9ecef; color: #212529; }
        .badge-tamanho { font-size: 0.85rem; padding: 5px 8px; }
        
        .quadrado-cor {
            width: 14px;
            height: 14px;
            display: inline-block;
            border-radius: 3px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            vertical-align: middle;
            margin-right: 3px;
        }
    </style>
</head>
<body>
    <div class="container py-3" style="max-width: 600px;">
        <h4 class="fw-bold mb-3 text-center">📦 Estoque Fábrica</h4>
        
        <!-- Cadastro de Peça -->
        <div class="card p-3 mb-4 shadow-sm border-0 rounded-3 bg-white">
            <h6 class="fw-bold mb-3 text-secondary">➕ Cadastrar Nova Peça</h6>
            <form action="/adicionar" method="POST" class="row g-2">
                <div class="col-6">
                    <input type="text" name="modelo" class="form-control" placeholder="Modelo" required>
                </div>
                <div class="col-6">
                    <input type="text" name="cor" class="form-control" placeholder="Cor (ex: Preto)" required>
                </div>
                <div class="col-6">
                    <select name="tamanho" class="form-select" required>
                        <option value="" disabled selected>Tamanho</option>
                        <option value="PP">PP</option>
                        <option value="P">P</option>
                        <option value="M">M</option>
                        <option value="G">G</option>
                        <option value="GG">GG</option>
                        <option value="G1">G1</option>
                        <option value="G2">G2</option>
                        <option value="G3">G3</option>
                    </select>
                </div>
                <div class="col-6">
                    <input type="number" name="quantidade" class="form-control" placeholder="Qtd Inicial" min="1" required>
                </div>
                <div class="col-12 mt-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold">Salvar no Estoque</button>
                </div>
            </form>
        </div>

        <!-- Barra de Busca em Tempo Real -->
        <div class="mb-3">
            <input type="text" id="campoBusca" class="form-control form-control-lg shadow-sm border-0" placeholder="🔍 Buscar por modelo ou cor...">
        </div>

        <!-- Cabeçalho da Lista -->
        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
            <h6 class="fw-bold text-secondary mb-0">🏷️ Peças Cadastradas</h6>
            <span class="badge bg-primary rounded-pill">{{ produtos|length }} itens</span>
        </div>

        <!-- Lista Expandível -->
        <div class="accordion" id="accordionEstoque">
            {% for p in produtos %}
            <div class="accordion-item item-estoque border-0 shadow-sm mb-2 rounded-3 overflow-hidden" data-busca="{{ p.modelo|lower }} {{ p.cor|lower }} {{ p.tamanho|lower }}">
                <h2 class="accordion-header" id="heading{{ p.id }}">
                    <button class="accordion-button collapsed py-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ p.id }}">
                        <div class="d-flex justify-content-between align-items-center w-100 pe-2">
                            <div>
                                <span class="fw-bold text-dark">{{ p.modelo }}</span>
                                <span class="text-muted ms-1">
                                    (<span class="quadrado-cor" style="background-color: {{ p.cor_hex }};"></span>{{ p.cor }})
                                </span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="badge bg-dark badge-tamanho">{{ p.tamanho }}</span>
                                <span class="fw-bold fs-6 bg-light text-dark px-2 py-1 rounded border">{{ p.quantidade }} un</span>
                            </div>
                        </div>
                    </button>
                </h2>
                <div id="collapse{{ p.id }}" class="accordion-collapse collapse" data-bs-parent="#accordionEstoque">
                    <div class="accordion-body bg-light border-top">
                        <div class="row g-2">
                            <!-- Dar Baixa (Saída) -->
                            <div class="col-6">
                                <form action="/baixa/{{ p.id }}" method="POST">
                                    <label class="form-label small fw-bold text-danger mb-1">Dar Saída</label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" name="qtd_baixa" value="1" min="1" max="{{ p.quantidade }}" class="form-control" required>
                                        <button type="submit" class="btn btn-danger">Dar Baixa</button>
                                    </div>
                                </form>
                            </div>

                            <!-- Adicionar (Entrada) -->
                            <div class="col-6">
                                <form action="/adicionar" method="POST">
                                    <input type="hidden" name="modelo" value="{{ p.modelo }}">
                                    <input type="hidden" name="cor" value="{{ p.cor }}">
                                    <input type="hidden" name="tamanho" value="{{ p.tamanho }}">
                                    <label class="form-label small fw-bold text-success mb-1">Adicionar Entrada</label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" name="quantidade" value="1" min="1" class="form-control" required>
                                        <button type="submit" class="btn btn-success">+</button>
                                    </div>
                                </form>
                            </div>

                            <!-- Deletar Peça -->
                            <div class="col-12 mt-3 text-end border-top pt-2">
                                <a href="/deletar/{{ p.id }}" class="btn btn-sm btn-outline-secondary" onclick="return confirm('Excluir totalmente {{ p.modelo }} do cadastro?')">
                                    🗑️ Excluir Produto
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="text-center py-4 text-muted bg-white rounded-3">Nenhuma peça cadastrada.</div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script da Busca em Tempo Real -->
    <script>
        document.getElementById('campoBusca').addEventListener('keyup', function() {
            let termo = this.value.toLowerCase().trim();
            let itens = document.querySelectorAll('.item-estoque');

            itens.forEach(function(item) {
                let textoItem = item.getAttribute('data-busca');
                if (textoItem.includes(termo)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
